[tool.poetry]
name = "calculate-primary"
version = "0.0.0"  # versioning handled by conventional commits
description = "OS2mo AMQP Trigger for recalculating primary"
authors = ["Magenta <info@magenta.dk>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://magenta.dk/"
repository = "https://git.magenta.dk/rammearkitektur/os2mo-triggers/os2mo-amqp-trigger-calculate-primary"
keywords = ["os2mo", "amqp"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^1.10.24"
fastramqpi = "^15.0.1"
fastapi = "^0.115.14"
uvicorn = "^0.34.3"
httpx = "^0.28.1"
websockets = "^13.1"
structlog = "^25.5.0"
more_itertools = "^10.8.0"
prometheus_client = "^0.21.1"

[tool.poetry.group.test.dependencies]
pytest-split = "^0.9.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.4.0"
hypothesis = "^6.103.1"
pytest = "^8.4.2"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^3.8.0"
ruff = "^0.5.6"
deptry = "^0.25.1"
mypy = "^1"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
ariadne-codegen = "^0.7.1"

[tool.ariadne-codegen]

target_package_name = "autogenerated_graphql_client"
target_package_path = "calculate_primary/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # curl -O http://localhost:5000/graphql/v22/schema.graphql
queries_path = "queries"
include_all_inputs = false
include_all_enums = false
include_comments = false
plugins = [
    # Return values directly when only a single top field is requested
    "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
]
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"
[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"

[tool.pytest.ini_options]
asyncio_mode="auto"
collect_imported_tests = false

[tool.mypy]
python_version = "3.11"
warn_return_any = "True"
warn_unused_configs = "True"
check_untyped_defs = "True"
disallow_untyped_defs = "True"
plugins = "pydantic.mypy, pydantic.v1.mypy"
exclude = [
    "calculate_primary/autogenerated_graphql_client/",

    # these are old mock-based tests that should be replaced anyway
    "tests/test_primary.py",
    "tests/test_sd.py"
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.deptry.per_rule_ignores]
DEP002 = [
  # uvicorn is used by the Dockerfile
  "uvicorn",
]
