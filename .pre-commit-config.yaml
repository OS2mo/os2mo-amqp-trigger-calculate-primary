---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        language: system
        exclude: |
          (?x)(
            ^calculate_primary/autogenerated_graphql_client/

            # these are old mock-based tests that should be replaced anyway
            | ^tests/test_primary.py
            | ^tests/test_sd.py
          )

  - repo: https://codeberg.org/fsfe/reuse-tool.git
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/fpgmaas/deptry.git
    rev: 0.25.1
    hooks:
      - id: deptry
